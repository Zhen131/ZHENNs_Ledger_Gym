# base: config/v3/dial-500k.yaml — Differs from dial-500k.yaml only in obs_set 0: the base observation set, 35 numbers, without the six long-range numbers of long; round three's control group (22A section two, item 7) at 500,000 steps, three seeds on the BTC-only line.
behaviors:
  TradingAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 1
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 500000
    time_horizon: 64
    summary_freq: 10000
environment_parameters:
  fee_rate: 0.001
  fixed_fee: 0.0
  slippage: 0.0
  obs_set: 0
  action_mode: 1
torch_settings:
  device: cpu
