# base: config/v3/dial.yaml — Smoke test for the PC in the dial mode. Differs from dial.yaml only in max_steps 15000, checkpoint_interval 15000 and summary_freq 1000 (the same as config/v2/smoke-long.yaml): one step is one decision of 24 candles, so the first episodes end at 16 agents x 90 decisions = 1,440 steps (2160 candles / 24 per episode, from gym-config.json), and summaries are only written every summary_freq steps, so with 1000 the Trading/* curves appear from 2,000 on.
behaviors:
  TradingAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 1
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 15000
    max_steps: 15000
    time_horizon: 64
    summary_freq: 1000
environment_parameters:
  fee_rate: 0.001
  fixed_fee: 0.0
  slippage: 0.0
  obs_set: 1
  action_mode: 1
torch_settings:
  device: cpu
