# base: config/v2/long.yaml — Differs from long.yaml only in action_mode 1: the dial mode, round three's main line (22A section two, items 5, 6 and 7): the model only turns the target position between the dial levels 30 %, 50 % and 70 %, one decision every 24 hourly candles, and a rule rebalances whenever the position is more than the band away from the target; decision_hours and rebalance_band are left out, so gym-config.json's decisionHours 24 and rebalanceBand 0.05 apply, and each training episode is 2160 candles (90 decisions), dialEpisodeLength in gym-config.json. Round three's four-coin line trains this same file with -Prefix mix and the coins on the player's command line, not a file of its own.
behaviors:
  TradingAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 1
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 2000000
    time_horizon: 64
    summary_freq: 10000
environment_parameters:
  fee_rate: 0.001
  fixed_fee: 0.0
  slippage: 0.0
  obs_set: 1
  action_mode: 1
torch_settings:
  device: cpu
