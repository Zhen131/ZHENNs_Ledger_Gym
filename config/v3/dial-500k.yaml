# base: config/v3/dial.yaml — Differs from dial.yaml only in max_steps 500000: round three's training length (22A section three, item 2; decided on the PC in batch 27). One step is one decision of 24 candles, and the training segment 2017-08-17..2021-12-31 has about 1,598 days, so 500,000 steps go through it about 313 times. The BTC-only line and the four-coin line (-Prefix mix) both train this file.
behaviors:
  TradingAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 1
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 500000
    time_horizon: 64
    summary_freq: 10000
environment_parameters:
  fee_rate: 0.001
  fixed_fee: 0.0
  slippage: 0.0
  obs_set: 1
  action_mode: 1
torch_settings:
  device: cpu
