# MULTIPLE CHANGES vs ppo_base.yaml: trainer SAC with the FoodCollector SAC hyperparameters (lr 0.0003 constant, batch 256, buffer 2048, buffer_init_steps 0, tau 0.005, steps_per_update 10, init_entcoef 0.05, reward_signal_steps_per_update 10); network and environment as base. Algorithm comparison.
behaviors:
  TradingAgent:
    trainer_type: sac
    hyperparameters:
      learning_rate: 0.0003
      learning_rate_schedule: constant
      batch_size: 256
      buffer_size: 2048
      buffer_init_steps: 0
      tau: 0.005
      steps_per_update: 10.0
      init_entcoef: 0.05
      reward_signal_steps_per_update: 10.0
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 1
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 2000000
    time_horizon: 64
    summary_freq: 10000
environment_parameters:
  fee_rate: 0.001
  fixed_fee: 0.0
  slippage: 0.0
torch_settings:
  device: cpu
