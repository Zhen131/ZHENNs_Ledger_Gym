# Differs from ppo_base.yaml only in risk_aversion 0.01 (base: not set, so the player uses -gymRiskAversion or the agent's default 0): every hour's score is r - 0.01 * min(r, 0)^2, an extra penalty on the squared loss only; does the agent cut its losses instead of simply holding?
behaviors:
  TradingAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 1
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 2000000
    time_horizon: 64
    summary_freq: 10000
environment_parameters:
  fee_rate: 0.001
  fixed_fee: 0.0
  slippage: 0.0
  risk_aversion: 0.01
torch_settings:
  device: cpu
