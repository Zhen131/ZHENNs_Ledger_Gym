# MULTIPLE CHANGES vs ppo_base.yaml: the course example's defaults: normalize true, 3 layers x 256, gamma 0.9, learning_rate 1e-4, batch 512, buffer 10000. Compares against the teacher's starting point.
behaviors:
  TradingAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 10000
      learning_rate: 0.0001
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.9
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 2000000
    time_horizon: 64
    summary_freq: 10000
environment_parameters:
  fee_rate: 0.001
  fixed_fee: 0.0
  slippage: 0.0
torch_settings:
  device: cpu
