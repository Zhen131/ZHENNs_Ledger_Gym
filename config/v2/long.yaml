# base: config/v2/ppo_v2.yaml — Differs from ppo_v2.yaml only in obs_set 1 (ppo_v2.yaml leaves it out, so the observationSet of gym-config.json, base): the long observation set, 41 numbers: the base 35 plus 1-day, 1-week, 30-day and 90-day returns scaled by volatility, the 30-day volatility and the drawdown from the 90-day high; round two's main line.
behaviors:
  TradingAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 1
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 500000
    max_steps: 2000000
    time_horizon: 64
    summary_freq: 10000
environment_parameters:
  fee_rate: 0.001
  fixed_fee: 0.0
  slippage: 0.0
  obs_set: 1
torch_settings:
  device: cpu
