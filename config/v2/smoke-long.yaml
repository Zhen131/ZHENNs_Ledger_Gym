# base: config/v2/long.yaml — Smoke test for the PC. Differs from long.yaml only in max_steps 15000, checkpoint_interval 15000 and summary_freq 1000: the first episodes end at 16 agents x 720 steps = 11,520 steps, and summaries are only written every summary_freq steps, so with 1000 the Trading/* curves appear from 12,000 on.
behaviors:
  TradingAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 1
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 15000
    max_steps: 15000
    time_horizon: 64
    summary_freq: 1000
environment_parameters:
  fee_rate: 0.001
  fixed_fee: 0.0
  slippage: 0.0
  obs_set: 1
torch_settings:
  device: cpu
