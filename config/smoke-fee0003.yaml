# Fee smoke test. Differs from ppo_base.yaml in fee_rate 0.003, max_steps 15000, summary_freq 5000, checkpoint_interval 30000 (smoke.yaml with fee 0.003 and 15k steps; 16 agents x 720 steps = 11,520 steps before the first episodes end and Trading/* appears, Q06).
behaviors:
  TradingAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 1
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 30000
    max_steps: 15000
    time_horizon: 64
    summary_freq: 5000
environment_parameters:
  fee_rate: 0.003
  fixed_fee: 0.0
  slippage: 0.0
torch_settings:
  device: cpu
